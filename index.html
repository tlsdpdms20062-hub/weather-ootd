<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 입지 · 날씨 맞춤 코디</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif; background: #eef0f3; color: #1d1f23; }
button, input, select { font: inherit; }
.app { max-width: 390px; min-height: 100vh; margin: 0 auto; background: #f8f9fb; padding: 16px 16px 90px; position: relative; }

.top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.top h1 { font-size: 20px; flex: 1; }
.loc, .muted { color: #7a808a; font-size: 13px; }
.center { text-align: center; margin: 6px 0; }
.warn { color: #c0392b; font-size: 13px; margin-bottom: 4px; }
.back { border: 0; background: none; font-size: 20px; cursor: pointer; }

.card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.section-title { font-size: 16px; margin: 18px 0 8px; }

.weather .temps { display: flex; align-items: baseline; gap: 10px; }
.weather .big { font-size: 34px; font-weight: 700; }
.weather .sub { color: #7a808a; font-size: 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: #eef1f6; }
.badge.alert { background: #fff1e0; color: #b35c00; }
.badge.rain { background: #e3f0ff; color: #1f5fbf; }

.look { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.look-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.score { font-weight: 700; color: #2d6cdf; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item { text-align: center; font-size: 12px; }
.item img, .item .empty { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #f0f2f5; display: flex; align-items: center; justify-content: center; color: #a0a6b0; }
.item p { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reason { margin-top: 10px; font-size: 13px; color: #444; background: #f6f8fc; padding: 8px 10px; border-radius: 8px; }

.btn { width: 100%; border: 0; border-radius: 12px; padding: 13px; background: #2d6cdf; color: #fff; font-weight: 600; cursor: pointer; margin-top: 8px; }
.btn:disabled { background: #b9c4d8; cursor: default; }
.btn.ghost { background: #fff; color: #2d6cdf; border: 1px solid #2d6cdf; }
.btn.small { padding: 8px; font-size: 13px; }
.row { display: flex; gap: 8px; }
.row label { flex: 1; font-size: 13px; }
.row input { width: 100%; margin-top: 4px; }
.gap { gap: 8px; }

.seg { display: flex; background: #e8ebf0; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: #fff; font-weight: 600; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cloth { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.cloth img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f0f2f5; }
.cloth .info { padding: 8px; font-size: 13px; }
.cloth .tags { display: flex; gap: 4px; margin: 4px 0 6px; }
.cloth .del { border: 0; background: none; color: #c0392b; font-size: 12px; cursor: pointer; padding: 0; }

.upload { display: flex; align-items: center; justify-content: center; height: 220px; border: 2px dashed #c3cad6; border-radius: 14px; background: #fff; cursor: pointer; overflow: hidden; margin-bottom: 4px; }
.upload img { width: 100%; height: 100%; object-fit: contain; }
#clothForm label { display: block; font-size: 13px; color: #555; margin-bottom: 10px; }
#clothForm input, #clothForm select { display: block; width: 100%; margin-top: 4px; padding: 10px; border: 1px solid #d5dae2; border-radius: 10px; background: #fff; }
.row input { padding: 8px; border: 1px solid #d5dae2; border-radius: 8px; }

.empty-msg { text-align: center; color: #7a808a; padding: 24px 8px; font-size: 14px; }

.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; display: flex; background: #fff; border-top: 1px solid #e3e6eb; padding-bottom: env(safe-area-inset-bottom); }
.tabbar button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 18px; color: #8a909a; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
.tabbar button span { font-size: 11px; margin-top: 2px; }
.tabbar button.on { color: #2d6cdf; }

.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,.9); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; max-width: 340px; text-align: center; z-index: 10; }
</style>
</head>
<body>
  <div class="app">

    <!-- ① 메인 -->
    <section id="home" class="screen">
      <header class="top"><h1>오늘 뭐 입지</h1><span class="loc">서울 동작구</span></header>

      <div id="weather" class="card weather"><p class="muted">날씨 불러오는 중…</p></div>

      <!-- 날씨 API 실패 시 직접 입력 -->
      <form id="manualWeather" class="card" hidden>
        <p class="warn" id="weatherError"></p>
        <p class="muted">기온을 직접 입력해도 추천받을 수 있어요.</p>
        <div class="row">
          <label>최저(°C)<input type="number" id="mMin" step="0.1" required></label>
          <label>최고(°C)<input type="number" id="mMax" step="0.1" required></label>
          <label>강수(%)<input type="number" id="mPop" min="0" max="100" value="0"></label>
        </div>
        <button class="btn">이 날씨로 추천</button>
      </form>

      <h2 class="section-title" id="todayTitle">오늘의 추천 코디</h2>
      <div id="todayLook"></div>
      <button id="moreBtn" class="btn" hidden>다른 코디 보기</button>
    </section>

    <!-- ④ 추천 결과 -->
    <section id="result" class="screen" hidden>
      <header class="top"><button class="back" data-go="home" aria-label="뒤로">←</button><h1>추천 코디</h1></header>
      <div id="resultList"></div>
      <div class="row gap">
        <button id="againBtn" class="btn ghost">다시 추천</button>
      </div>
    </section>

    <!-- ③ 내 옷장 -->
    <section id="closet" class="screen" hidden>
      <header class="top"><h1>내 옷장</h1><span class="muted" id="closetCount"></span></header>
      <div class="seg" id="closetTabs">
        <button data-type="상의" class="on">상의</button>
        <button data-type="하의">하의</button>
        <button data-type="아우터">아우터</button>
      </div>
      <div id="closetGrid" class="grid"></div>
    </section>

    <!-- ② 옷 등록 -->
    <section id="add" class="screen" hidden>
      <header class="top"><h1>옷 등록</h1></header>

      <label class="upload" id="uploadBox">
        <input type="file" id="photo" accept="image/*" hidden>
        <img id="preview" alt="" hidden>
        <span id="uploadHint">📷 옷 사진 올리기</span>
      </label>
      <p id="scanStatus" class="muted center"></p>

      <form id="clothForm" class="card">
        <label>이름 <input id="fName" maxlength="20" placeholder="예: 네이비 니트" required></label>
        <label>종류 <select id="fType" required></select></label>
        <label>색상 <select id="fColor" required></select></label>
        <label>두께 <select id="fThick" required></select></label>
        <button class="btn" id="saveBtn" disabled>옷장에 저장</button>
      </form>
    </section>

    <nav class="tabbar">
      <button data-go="home" class="on">🏠<span>홈</span></button>
      <button data-go="closet">👕<span>내 옷장</span></button>
      <button data-go="add">➕<span>옷 등록</span></button>
    </nav>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script>
/* === js/recommend.js (api/scan.js와 공유, 수정 시 둘 다 반영) === */
// F3 색조합 규칙 + F4 코디 추천 (규칙 기반, PRD 5장)
// 브라우저(<script>)와 Node(테스트) 양쪽에서 쓸 수 있게 만든다.
(function (root) {
  const TYPES = ["상의", "하의", "아우터"];
  const THICKS = ["얇음", "보통", "두꺼움"];

  // 색 그룹 (PRD 16색 전부)
  const colorGroup = {
    블랙: "무채색", 화이트: "무채색", 그레이: "무채색",
    베이지: "뉴트럴", 브라운: "뉴트럴", 카키: "뉴트럴", 아이보리: "뉴트럴",
    네이비: "쿨톤", 블루: "쿨톤", 데님: "쿨톤", 그린: "쿨톤",
    레드: "포인트", 옐로: "포인트", 핑크: "포인트", 오렌지: "포인트", 퍼플: "포인트"
  };
  const COLORS = Object.keys(colorGroup);

  // 상하의 색조합 점수 (행 = 상의, 열 = 하의)
  const colorScore = {
    무채색: { 무채색: 90, 뉴트럴: 85, 쿨톤: 90, 포인트: 80 },
    뉴트럴: { 무채색: 85, 뉴트럴: 75, 쿨톤: 90, 포인트: 60 },
    쿨톤:   { 무채색: 90, 뉴트럴: 90, 쿨톤: 70, 포인트: 55 },
    포인트: { 무채색: 80, 뉴트럴: 60, 쿨톤: 55, 포인트: 30 }
  };

  // ① 기온 → 두께. 최고기온으로 상의·하의, 최저기온으로 아우터를 정한다.
  function getThickness(minTemp, maxTemp) {
    let top, bottom, outer;

    if (maxTemp >= 17)      top = ["얇음"];            // 23↑ 반팔, 17~22 긴팔·셔츠
    else if (maxTemp >= 12) top = ["보통"];            // 맨투맨, 니트
    else if (maxTemp >= 5)  top = ["보통", "두꺼움"];  // 보통~두꺼움
    else                    top = ["두꺼움"];

    if (maxTemp >= 23)      bottom = "얇음";
    else if (maxTemp >= 5)  bottom = "보통";
    else                    bottom = "두꺼움";

    if (minTemp >= 17)      outer = null;              // 아우터 필요 없음
    else if (minTemp >= 12) outer = "얇음";
    else if (minTemp >= 5)  outer = "보통";
    else                    outer = "두꺼움";

    // F2 규칙: 일교차 8° 이상이면 아침·저녁용 얇은 아우터를 챙긴다.
    if (outer === null && maxTemp - minTemp >= 8) outer = "얇음";

    return { top, bottom, outer };
  }

  // ② 추천 이유 문구
  function makeReason(topG, bottomG, minTemp, needOuter, hasOuter) {
    let r;
    if (topG === "포인트" && bottomG === "포인트") r = "강한 색끼리는 부딪힐 수 있어요";
    else if (topG === "무채색" || bottomG === "무채색") r = "무채색은 어떤 색과도 잘 어울려요";
    else if ((topG === "쿨톤" && bottomG === "뉴트럴") || (topG === "뉴트럴" && bottomG === "쿨톤"))
      r = "차분한 쿨톤과 따뜻한 뉴트럴이 균형을 맞춰줘요";
    else if (topG === bottomG) r = `같은 ${topG} 계열이라 톤이 통일돼요`;
    else r = `${topG} 상의에 ${bottomG} 하의로 포인트를 줬어요`;

    if (needOuter) {
      r += hasOuter
        ? ` · 아침 ${minTemp}°라 아우터를 껴입어요`
        : ` · 아침 ${minTemp}°라 아우터가 필요한데 맞는 아우터가 없어요`;
    }
    return r;
  }

  // ③ 조건에 맞는 옷이 없는 종류 (옷 부족 안내용)
  function findMissing(closet, need) {
    const missing = [];
    if (!closet.some(c => c.type === "상의" && need.top.includes(c.thick))) missing.push("상의");
    if (!closet.some(c => c.type === "하의" && c.thick === need.bottom)) missing.push("하의");
    if (need.outer && !closet.some(c => c.type === "아우터" && c.thick === need.outer)) missing.push("아우터");
    return missing;
  }

  // 필요한 두께의 아우터가 없을 때 대신 쓸 두께 (가까운 순)
  const ADJ = { 얇음: "얇은", 보통: "보통", 두꺼움: "두꺼운" };
  const OUTER_FALLBACK = { 얇음: ["보통"], 보통: ["두꺼움", "얇음"], 두꺼움: ["보통"] };

  // 아우터 후보 고르기: 정확한 두께 → 없으면 가까운 두께
  function pickOuters(closet, need) {
    if (!need) return { list: [], thick: null };
    const known = c => colorGroup[c.color] !== undefined;
    for (const th of [need, ...OUTER_FALLBACK[need]]) {
      const list = closet.filter(c => c.type === "아우터" && c.thick === th && known(c));
      if (list.length) return { list, thick: th };
    }
    return { list: [], thick: null };
  }

  // ④ 가능한 모든 코디를 점수 높은 순으로 반환
  //    아우터가 여러 벌이면 아우터마다 다른 코디로 만든다
  function rankLooks(closet, minTemp, maxTemp) {
    const need = getThickness(minTemp, maxTemp);
    const known = c => colorGroup[c.color] !== undefined;   // 모르는 색은 제외

    const tops    = closet.filter(c => c.type === "상의" && need.top.includes(c.thick) && known(c));
    const bottoms = closet.filter(c => c.type === "하의" && c.thick === need.bottom && known(c));
    const outer   = pickOuters(closet, need.outer);
    const needOuter = need.outer !== null;
    const outerList = outer.list.length ? outer.list : [null];

    const looks = [];
    for (const top of tops) {
      for (const bottom of bottoms) {
        const tg = colorGroup[top.color];
        const bg = colorGroup[bottom.color];
        for (const o of outerList) {
          let reason = makeReason(tg, bg, minTemp, needOuter, o !== null);
          if (o && outer.thick !== need.outer)
            reason += ` (${ADJ[need.outer]} 아우터가 없어 ${ADJ[outer.thick]} 아우터로 대신했어요)`;
          looks.push({
            top, bottom, outer: o, needOuter,
            score: colorScore[tg][bg],
            outerScore: o ? colorScore[colorGroup[o.color]][bg] : 0,   // 같은 점수면 하의와 어울리는 아우터 먼저
            reason
          });
        }
      }
    }

    looks.sort((a, b) => b.score - a.score || b.outerScore - a.outerScore);
    return looks;
  }

  // ⑤ page 0 → 1~3위, page 1 → 4~6위 ("다시 추천")
  function recommend(closet, minTemp, maxTemp, page = 0) {
    return rankLooks(closet, minTemp, maxTemp).slice(page * 3, page * 3 + 3);
  }

  const api = { TYPES, THICKS, COLORS, colorGroup, colorScore,
                getThickness, makeReason, findMissing, rankLooks, recommend };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.Reco = api;
})(this);
</script>
  <script>
// 화면 동작 (F1 옷 등록, F2 날씨 표시, F4 추천 표시)
(function () {
  const { TYPES, THICKS, COLORS, rankLooks, getThickness, findMissing } = window.Reco;
  const $ = s => document.querySelector(s);
  const KEY = "closet";

  const state = { weather: null, ranked: [], page: 0, chosen: null, closetTab: "상의", image: null };

  // ---------- 공통 ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 2200);
  }

  function loadCloset() {
    try { const c = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(c) ? c : []; }
    catch { return []; }
  }
  function saveCloset(closet) {
    try { localStorage.setItem(KEY, JSON.stringify(closet)); return true; }
    catch { toast("저장 공간이 부족해요. 옷을 몇 벌 지운 뒤 다시 시도해 주세요"); return false; }
  }

  // 응답이 JSON이 아니면(서버리스 함수 없음 등) 알아보기 쉬운 오류로 바꾼다
  async function fetchJson(url, opts) {
    const r = await fetch(url, opts);
    let d;
    try { d = await r.json(); } catch { throw new Error(`서버 응답 없음 (${r.status})`); }
    if (!r.ok) throw new Error(d.error || `서버 오류 (${r.status})`);
    return d;
  }

  function go(screen) {
    document.querySelectorAll(".screen").forEach(s => (s.hidden = s.id !== screen));
    document.querySelectorAll(".tabbar button").forEach(b =>
      b.classList.toggle("on", b.dataset.go === screen || (screen === "result" && b.dataset.go === "home")));
    if (screen === "home") renderHome();
    if (screen === "closet") renderCloset();
    if (screen === "result") renderResult();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

  // ---------- F2 날씨 ----------
  function summarizeManual(minTemp, maxTemp, pop) {
    const range = Math.round((maxTemp - minTemp) * 10) / 10;
    return { minTemp, maxTemp, range, pop, needOuter: range >= 8, umbrella: pop >= 60, manual: true };
  }

  async function loadWeather() {
    // 테스트용: ?min=6&max=15&pop=70 으로 기온을 강제로 넣을 수 있다
    const q = new URLSearchParams(location.search);
    if (q.has("min") && q.has("max")) {
      state.weather = summarizeManual(Number(q.get("min")), Number(q.get("max")), Number(q.get("pop") || 0));
      return renderHome();
    }
    try {
      state.weather = await fetchJson("/api/weather");
    } catch (e) {
      $("#weatherError").textContent = location.protocol === "file:"
        ? "파일로 직접 열면 날씨 API가 동작하지 않아요 (배포 주소나 vercel dev에서 동작)"
        : `날씨를 불러오지 못했어요 (${e.message})`;
      $("#manualWeather").hidden = false;
      $("#weather").hidden = true;
    }
    renderHome();
  }

  $("#manualWeather").addEventListener("submit", e => {
    e.preventDefault();
    const min = Number($("#mMin").value), max = Number($("#mMax").value), pop = Number($("#mPop").value || 0);
    if (min > max) return toast("최저기온이 최고기온보다 높아요");
    state.weather = summarizeManual(min, max, pop);
    $("#manualWeather").hidden = true;
    $("#weather").hidden = false;
    renderHome();
  });

  function renderWeather() {
    const w = state.weather;
    if (!w) return;
    const badges = [`일교차 ${w.range}°`, `강수확률 ${w.pop}%`].map(t => `<span class="badge">${t}</span>`);
    if (w.needOuter) badges.push(`<span class="badge alert">🧥 아우터 필요</span>`);
    if (w.umbrella) badges.push(`<span class="badge rain">☂️ 우산 챙기세요</span>`);
    $("#weather").innerHTML = `
      <div class="temps"><span class="big">${w.minTemp}° / ${w.maxTemp}°</span></div>
      <p class="sub">등교~귀가(08~18시) 최저 / 최고${w.manual ? " · 직접 입력" : ""}</p>
      <div class="badges">${badges.join("")}</div>`;
  }

  // ---------- F4 추천 ----------
  function computeRanking() {
    const w = state.weather;
    state.ranked = w ? rankLooks(loadCloset(), w.minTemp, w.maxTemp) : [];
  }

  function itemHtml(c, label) {
    if (!c) return `<div class="item"><div class="empty">${label}<br>없음</div><p>&nbsp;</p></div>`;
    return `<div class="item"><img src="${esc(c.image)}" alt=""><p>${esc(c.name)}</p></div>`;
  }

  function lookHtml(look, rank, withWear) {
    return `
      <div class="look">
        <div class="look-head"><b>${rank ? `추천 ${rank}` : "오늘의 코디"}</b><span class="score">${look.score}점</span></div>
        <div class="items">
          ${itemHtml(look.top, "상의")}${itemHtml(look.bottom, "하의")}
          ${look.needOuter ? itemHtml(look.outer, "아우터") : `<div class="item"><div class="empty">아우터<br>불필요</div><p>&nbsp;</p></div>`}
        </div>
        <p class="reason">${esc(look.reason)}</p>
        ${withWear ? `<button class="btn small wear" data-idx="${rank - 1}">이걸로 입기</button>` : ""}
      </div>`;
  }

  function missingHtml() {
    const w = state.weather;
    const need = getThickness(w.minTemp, w.maxTemp);
    const miss = findMissing(loadCloset(), need);
    const what = miss.length ? miss.map(t => {
      const th = t === "상의" ? need.top.join("/") : t === "하의" ? need.bottom : need.outer;
      return `${th} ${t}`;
    }).join(", ") : "옷";
    return `<div class="card empty-msg">이 날씨에 맞는 옷을 더 등록해 주세요<br><small>필요: ${esc(what)}</small></div>`;
  }

  // 시연·테스트용 샘플 옷 (색 블록 이미지)
  const HEX = { 블랙:"#222", 화이트:"#f4f4f4", 그레이:"#999", 베이지:"#d9c3a0", 브라운:"#7b5235", 카키:"#7d7a4f",
    아이보리:"#f3ecd8", 네이비:"#1f2f5c", 블루:"#3a6fd8", 데님:"#4a6a96", 그린:"#3d8b4f",
    레드:"#d23b3b", 옐로:"#f2c53d", 핑크:"#f29bb8", 오렌지:"#f08a2e", 퍼플:"#7d4fb3" };
  // 옷 이름으로 모양을 정하고, 실제 색으로 칠한 옷 그림을 만든다
  const SHAPE = {
    tee:   '<path d="M72 40 L128 40 L166 66 L150 92 L138 84 L138 168 L62 168 L62 84 L50 92 L34 66 Z"/><path d="M86 40 Q100 56 114 40" fill="none"/>',
    long:  '<path d="M72 40 L128 40 L160 60 L174 150 L154 154 L140 88 L140 168 L60 168 L60 88 L46 154 L26 150 L40 60 Z"/><path d="M86 40 Q100 56 114 40" fill="none"/>',
    shirt: '<path d="M72 40 L128 40 L160 60 L174 150 L154 154 L140 88 L140 168 L60 168 L60 88 L46 154 L26 150 L40 60 Z"/><path d="M84 40 L100 62 L116 40" fill="none"/><path d="M100 62 L100 168" fill="none"/><circle cx="100" cy="85" r="3"/><circle cx="100" cy="110" r="3"/><circle cx="100" cy="135" r="3"/>',
    hood:  '<path d="M72 44 L128 44 L160 62 L174 150 L154 154 L140 90 L140 168 L60 168 L60 90 L46 154 L26 150 L40 62 Z"/><path d="M76 46 Q100 12 124 46 Q100 64 76 46 Z"/><rect x="74" y="120" width="52" height="26" rx="6" fill="none"/>',
    shorts:'<path d="M54 56 L146 56 L158 136 L108 136 L100 92 L92 136 L42 136 Z"/><path d="M54 68 L146 68" fill="none"/>',
    pants: '<path d="M60 28 L140 28 L150 176 L112 176 L100 76 L88 176 L50 176 Z"/><path d="M60 40 L140 40" fill="none"/>',
    coat:  '<path d="M72 34 L128 34 L162 56 L176 160 L156 164 L142 90 L142 182 L58 182 L58 90 L44 164 L24 160 L38 56 Z"/><path d="M86 34 L100 80 L114 34" fill="none"/><path d="M100 80 L100 182" fill="none"/><circle cx="92" cy="105" r="3"/><circle cx="92" cy="135" r="3"/><circle cx="92" cy="165" r="3"/>',
    padding:'<path d="M70 32 L130 32 L164 54 L178 158 L156 162 L144 92 L144 180 L56 180 L56 92 L44 162 L22 158 L36 54 Z"/><path d="M56 70 L144 70 M56 100 L144 100 M56 130 L144 130 M56 160 L144 160 M100 32 L100 180" fill="none"/>'
  };
  function shapeOf(name, type) {
    if (type === "상의") {
      if (/반팔|티셔츠|반소매/.test(name)) return "tee";
      if (/셔츠|블라우스/.test(name)) return "shirt";
      if (/후드/.test(name)) return "hood";
      return "long";
    }
    if (type === "하의") return /반바지|숏|쇼츠/.test(name) ? "shorts" : "pants";
    return /패딩|점퍼|파카/.test(name) ? "padding" : "coat";
  }
  function sampleImage(color, type, name = "") {
    const fill = HEX[color] || "#ccc";
    const dark = ["블랙", "네이비", "브라운", "카키", "데님", "그린", "퍼플"].includes(color);
    const line = dark ? "rgba(255,255,255,.45)" : "rgba(0,0,0,.35)";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">` +
      `<rect width="200" height="200" fill="#eef0f3"/>` +
      `<g fill="${fill}" stroke="${line}" stroke-width="3" stroke-linejoin="round">${SHAPE[shapeOf(name, type)]}</g></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  // 예전 버전에서 넣은 샘플 옷 그림을 새 그림으로 바꾼다
  (function migrateSamples() {
    const c = loadCloset();
    if (!c.some(x => String(x.id).startsWith("s_"))) return;
    saveCloset(c.map(x => String(x.id).startsWith("s_") ? { ...x, image: sampleImage(x.color, x.type, x.name) } : x));
  })();
  const SAMPLES = [
    ["화이트 반팔", "상의", "화이트", "얇음"], ["네이비 셔츠", "상의", "네이비", "얇음"],
    ["베이지 니트", "상의", "베이지", "보통"], ["그레이 맨투맨", "상의", "그레이", "보통"],
    ["블랙 후드", "상의", "블랙", "두꺼움"],
    ["데님 반바지", "하의", "데님", "얇음"], ["베이지 슬랙스", "하의", "베이지", "보통"],
    ["청바지", "하의", "데님", "보통"], ["블랙 기모바지", "하의", "블랙", "두꺼움"],
    ["카키 가디건", "아우터", "카키", "얇음"], ["네이비 코트", "아우터", "네이비", "보통"],
    ["블랙 패딩", "아우터", "블랙", "두꺼움"]
  ];
  function addSamples() {
    const t = Date.now();
    const items = SAMPLES.map(([name, type, color, thick], i) =>
      ({ id: `s_${t}_${i}`, name, type, color, thick, image: sampleImage(color, type, name) }));
    if (saveCloset(loadCloset().concat(items))) { toast(`샘플 옷 ${items.length}벌을 넣었어요`); renderHome(); }
  }

  function emptyClosetHtml() {
    return `<div class="card empty-msg">옷장이 비어 있어요<br><small>옷 등록 탭에서 옷을 올리거나 샘플로 체험해 보세요</small>
      <button class="btn ghost small" id="sampleBtn">샘플 옷으로 체험하기</button></div>`;
  }

  function renderHome() {
    renderWeather();
    const empty = loadCloset().length === 0;
    if (!state.weather) {
      $("#todayLook").innerHTML = empty ? emptyClosetHtml()
        : `<div class="card empty-msg">위에 기온을 입력하면 코디를 추천해 드려요</div>`;
      $("#moreBtn").hidden = true;
      bindSample();
      return;
    }
    if (empty) { $("#todayLook").innerHTML = emptyClosetHtml(); $("#moreBtn").hidden = true; bindSample(); return; }
    computeRanking();
    // 고른 코디가 옷장에서 지워졌으면 해제
    const ids = new Set(loadCloset().map(c => c.id));
    if (state.chosen && !(ids.has(state.chosen.top.id) && ids.has(state.chosen.bottom.id))) state.chosen = null;

    const look = state.chosen || state.ranked[0];
    $("#todayTitle").textContent = state.chosen ? "오늘 입을 코디 ✅" : "오늘의 추천 코디";
    $("#todayLook").innerHTML = look ? lookHtml(look, 0, false) : missingHtml();
    $("#moreBtn").hidden = state.ranked.length === 0;
  }

  function bindSample() { const b = $("#sampleBtn"); if (b) b.addEventListener("click", addSamples); }

  $("#moreBtn").addEventListener("click", () => { state.page = 0; go("result"); });

  function renderResult() {
    if (!state.weather) return go("home");
    computeRanking();
    const start = state.page * 3;
    const looks = state.ranked.slice(start, start + 3);
    $("#resultList").innerHTML = looks.length
      ? looks.map((l, i) => lookHtml(l, start + i + 1, true)).join("")
      : missingHtml();
    $("#againBtn").hidden = state.ranked.length <= 3;
    document.querySelectorAll(".wear").forEach(b => b.addEventListener("click", () => {
      state.chosen = state.ranked[Number(b.dataset.idx)];
      toast("오늘 코디로 정했어요");
      go("home");
    }));
  }

  $("#againBtn").addEventListener("click", () => {
    state.page++;
    if (state.page * 3 >= state.ranked.length) { state.page = 0; toast("처음 추천으로 돌아왔어요"); }
    renderResult();
    window.scrollTo(0, 0);
  });

  // ---------- 내 옷장 ----------
  document.querySelectorAll("#closetTabs button").forEach(b => b.addEventListener("click", () => {
    state.closetTab = b.dataset.type;
    document.querySelectorAll("#closetTabs button").forEach(x => x.classList.toggle("on", x === b));
    renderCloset();
  }));

  function renderCloset() {
    const closet = loadCloset();
    $("#closetCount").textContent = `총 ${closet.length}벌`;
    const list = closet.filter(c => c.type === state.closetTab);
    $("#closetGrid").innerHTML = list.length ? list.map(c => `
      <div class="cloth">
        <img src="${esc(c.image)}" alt="">
        <div class="info">
          <b>${esc(c.name)}</b>
          <div class="tags"><span class="badge">${esc(c.color)}</span><span class="badge">${esc(c.thick)}</span></div>
          <button class="del" data-id="${esc(c.id)}">삭제</button>
        </div>
      </div>`).join("")
      : `<p class="empty-msg" style="grid-column:1/-1">등록된 ${state.closetTab}가 없어요</p>`;

    document.querySelectorAll(".del").forEach(b => b.addEventListener("click", () => {
      if (!confirm("이 옷을 삭제할까요?")) return;
      saveCloset(loadCloset().filter(c => c.id !== b.dataset.id));
      renderCloset();
    }));
  }

  // ---------- F1 옷 등록 ----------
  const fill = (sel, list) => ($(sel).innerHTML =
    `<option value="">선택</option>` + list.map(v => `<option>${v}</option>`).join(""));
  fill("#fType", TYPES); fill("#fColor", COLORS); fill("#fThick", THICKS);

  // 폭 400px로 줄여 JPEG data URL로 만든다 (localStorage 용량 절약)
  function resizeImage(file, maxW = 400) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxW / img.width);
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s);
        cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없어요")); };
      img.src = url;
    });
  }

  $("#photo").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      state.image = await resizeImage(file);
    } catch (err) { return toast(err.message); }

    $("#preview").src = state.image; $("#preview").hidden = false; $("#uploadHint").hidden = true;
    $("#saveBtn").disabled = true;
    $("#scanStatus").textContent = "AI가 옷을 인식하는 중…";

    try {
      const d = await fetchJson("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: state.image })
      });
      if (d.name) $("#fName").value = d.name;
      if (d.type) $("#fType").value = d.type;
      if (d.color) $("#fColor").value = d.color;
      if (d.thick) $("#fThick").value = d.thick;
      $("#scanStatus").textContent = d.ok
        ? "인식 완료! 맞는지 확인하고 저장하세요"
        : "일부를 인식하지 못했어요. 빈 칸을 직접 골라 주세요";
    } catch (err) {
      $("#scanStatus").textContent = location.protocol === "file:"
        ? "파일로 직접 열면 AI 인식이 안 돼요 — 직접 입력해 주세요"
        : `인식 실패 (${err.message}) — 직접 입력해 주세요`;
    }
    $("#saveBtn").disabled = false;
  });

  $("#clothForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!state.image) return toast("사진을 먼저 올려 주세요");
    const cloth = {
      id: "c_" + Date.now(),
      name: $("#fName").value.trim(),
      type: $("#fType").value,
      color: $("#fColor").value,
      thick: $("#fThick").value,
      image: state.image
    };
    const closet = loadCloset();
    closet.push(cloth);
    if (!saveCloset(closet)) return;

    toast(`${cloth.name} 저장 완료`);
    state.image = null;
    $("#clothForm").reset();
    $("#photo").value = "";
    $("#preview").hidden = true; $("#uploadHint").hidden = false;
    $("#scanStatus").textContent = "";
    $("#saveBtn").disabled = true;
  });

  // ---------- 시작 ----------
  loadWeather();
})();
</script>
</body>
</html>
